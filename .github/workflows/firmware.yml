name: Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build (ESP-IDF 5.5)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32s3
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o m5gemini-full.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: m5gemini-firmware
          path: |
            build/m5gemini-full.bin
            build/*.bin
          if-no-files-found: error
